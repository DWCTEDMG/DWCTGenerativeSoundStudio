[project]
name = "edmg-hf-bucket-helper"
version = "1.0.0"
description = "Isolated Hugging Face Bucket transport for EDMG Studio"
requires-python = ">=3.12,<3.13"
dependencies = [
  "hf-xet==1.5.1",
  "huggingface-hub==1.20.1",
]

[project.scripts]
edmg-hf-bucket-helper = "edmg_hf_bucket_helper.__main__:main"

[dependency-groups]
build = [
  "pyinstaller==6.21.0",
]
test = [
  "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edmg_hf_bucket_helper"]

[tool.uv]
package = true
