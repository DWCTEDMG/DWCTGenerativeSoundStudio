version: 2

updates:
  - package-ecosystem: "npm"
    directories:
      - "/studio/edmg-studio"
      - "/chatgpt-apps/edmg-director"
    schedule:
      interval: "weekly"
    # Keep routine version churn out of the queue while still opening grouped
    # pull requests for security fixes.
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/studio/edmg-studio/python_backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
