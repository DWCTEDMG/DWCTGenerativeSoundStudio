name: EDMG Director

on:
  push:
    paths:
      - "chatgpt-apps/edmg-director/**"
      - ".github/workflows/edmg-director.yml"
  pull_request:
    paths:
      - "chatgpt-apps/edmg-director/**"
      - ".github/workflows/edmg-director.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatgpt-apps/edmg-director

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chatgpt-apps/edmg-director/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
