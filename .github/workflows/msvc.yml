name: Microsoft C++ Code Analysis

on:
  push:
    branches: [ "codex/Unified" ]
  pull_request:
    branches: [ "codex/Unified" ]
  schedule:
    - cron: '38 22 * * 5'

env:
  # Path to the CMake build directory.
  # Keep generated JUCE dependency sources under the CMake source tree. The
  # legacy MSVC analysis action otherwise prepends the source root to absolute
  # dependency paths and fails before analysis begins.
  build: '${{ github.workspace }}/juce_example/build'

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S juce_example -B "${{ env.build }}"

      # Build is not required unless generated source files are used
      # - name: Build CMake
      #   run: cmake --build ${{ env.build }}

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@04825f6d9e00f87422d6bf04e1a38b1f3ed60d99
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset

      # The legacy MSVC action emits one SARIF run per translation unit without
      # categories. upload-sarif v4 rejects multiple runs from the same tool and
      # category, so assign each translation unit a stable, distinct category.
      - name: Assign unique SARIF categories
        shell: pwsh
        env:
          SARIF_PATH: ${{ steps.run-analysis.outputs.sarif }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sarif = Get-Content -LiteralPath $env:SARIF_PATH -Raw | ConvertFrom-Json
          if (-not $sarif.runs -or $sarif.runs.Count -eq 0) {
            throw 'MSVC analysis produced no SARIF runs.'
          }
          for ($index = 0; $index -lt $sarif.runs.Count; $index++) {
            $details = [pscustomobject]@{ id = "msvc/translation-unit-$index/" }
            $sarif.runs[$index] | Add-Member -NotePropertyName automationDetails -NotePropertyValue $details -Force
          }
          $sarif | ConvertTo-Json -Depth 100 -Compress | Set-Content -LiteralPath $env:SARIF_PATH -Encoding utf8NoBOM -NoNewline

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}

      # Upload SARIF file as an Artifact to download and view
      # - name: Upload SARIF as an Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: sarif-file
      #     path: ${{ steps.run-analysis.outputs.sarif }}
