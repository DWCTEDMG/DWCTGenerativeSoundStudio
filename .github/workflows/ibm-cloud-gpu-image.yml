name: IBM Cloud CUDA backend image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish CUDA backend image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: studio/edmg-studio/python_backend
          file: studio/edmg-studio/python_backend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: EDMG_TORCH_EXTRA=cuda
          tags: ghcr.io/dwctedmg/edmg-studio-backend:v1-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Report immutable image digest
        run: |
          {
            echo '### Published CUDA backend image'
            echo
            echo '`ghcr.io/dwctedmg/edmg-studio-backend@${{ steps.publish.outputs.digest }}`'
          } >> "$GITHUB_STEP_SUMMARY"
