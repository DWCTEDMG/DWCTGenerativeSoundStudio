name: EDMG Studio

on:
  push:
    paths:
      - "studio/edmg-studio/**"
      - ".python-version"
      - "deployment/**"
      - "scripts/run_pytest_scopes.py"
      - "tests/**"
      - "pytest.ini"
      - "sitecustomize.py"
      - ".github/workflows/studio.yml"
  pull_request:
    paths:
      - "studio/edmg-studio/**"
      - ".python-version"
      - "deployment/**"
      - "scripts/run_pytest_scopes.py"
      - "tests/**"
      - "pytest.ini"
      - "sitecustomize.py"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Studio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: studio/edmg-studio/pnpm-lock.yaml

      - name: Setup pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: studio/edmg-studio/python_backend/uv.lock

      - name: Install pinned Python
        run: uv python install 3.12

      - name: Validate and sync Studio backend lock
        working-directory: studio/edmg-studio/python_backend
        run: |
          uv lock --check
          uv sync --frozen --extra cpu --extra core --extra audio --group test --group lint

      - name: Provision pinned FFmpeg
        shell: pwsh
        env:
          FFMPEG_LINUX_ASSET: ffmpeg-N-125773-g7002e01c19-linux64-gpl.tar.xz
          FFMPEG_LINUX_SHA256: 5abcecd8f7899cf5491cb8fac00767886cf433d9e96fb3c0065132a3daa8fcac
          FFMPEG_LINUX_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-26-13-28/ffmpeg-N-125773-g7002e01c19-linux64-gpl.tar.xz
          FFMPEG_WINDOWS_ASSET: ffmpeg-7.0.2-essentials_build.zip
          FFMPEG_WINDOWS_SHA256: d5308d30872b2739cf53169df61faba8639d39a19b20b91e611c177ef676f64c
          FFMPEG_WINDOWS_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.0.2/ffmpeg-7.0.2-essentials_build.zip
        run: |
          $ErrorActionPreference = "Stop"
          if ($IsWindows) {
            $asset = $env:FFMPEG_WINDOWS_ASSET
            $expectedSha256 = $env:FFMPEG_WINDOWS_SHA256
            $downloadUrls = @($env:FFMPEG_WINDOWS_URL)
            $ffmpegName = "ffmpeg.exe"
            $ffprobeName = "ffprobe.exe"
          } elseif ($IsLinux) {
            $asset = $env:FFMPEG_LINUX_ASSET
            $expectedSha256 = $env:FFMPEG_LINUX_SHA256
            $downloadUrls = @($env:FFMPEG_LINUX_URL)
            $ffmpegName = "ffmpeg"
            $ffprobeName = "ffprobe"
          } else {
            throw "Unsupported FFmpeg runner OS: $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription)"
          }

          $archive = Join-Path $env:RUNNER_TEMP $asset
          $installRoot = Join-Path $env:RUNNER_TEMP "edmg-ffmpeg"
          $downloaded = $false
          $checksumFailures = @()
          foreach ($url in $downloadUrls) {
            try {
              Remove-Item -LiteralPath $archive -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3
              $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualSha256 -ne $expectedSha256) {
                $checksumFailures += "$url returned $actualSha256"
                Write-Host "FFmpeg checksum mismatch from $url; trying the next pinned location."
                continue
              }
              $downloaded = $true
              break
            } catch {
              Write-Host "FFmpeg download failed from $url; trying the next pinned location."
            }
          }
          if (-not $downloaded) {
            throw "Unable to download a checksum-valid pinned FFmpeg archive (expected $expectedSha256). Attempts: $($checksumFailures -join '; ')"
          }

          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          if ($IsWindows) {
            Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          } else {
            & tar -xJf $archive -C $installRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract FFmpeg archive (tar exit code $LASTEXITCODE)"
            }
          }

          $ffmpeg = Get-ChildItem -LiteralPath $installRoot -Recurse -File -Filter $ffmpegName | Select-Object -First 1
          if (-not $ffmpeg) {
            throw "$ffmpegName was not found after extracting $asset"
          }
          $ffprobe = Join-Path $ffmpeg.Directory.FullName $ffprobeName
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) {
            throw "$ffprobeName was not found beside $($ffmpeg.FullName)"
          }

          $ffmpeg.Directory.FullName >> $env:GITHUB_PATH
          "EDMG_FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "EDMG_FFPROBE_PATH=$ffprobe" >> $env:GITHUB_ENV

      - name: Verify FFmpeg discovery
        working-directory: studio/edmg-studio/python_backend
        run: >-
          uv run --frozen --extra cpu --extra core --extra audio --group test python -c "import shutil, subprocess; from pathlib import Path; from edmg_studio_backend.config import Settings;
          from edmg_studio_backend.services.ffmpeg import ensure_ffmpeg, ensure_ffprobe;
          configured = Settings().ffmpeg_path; ffmpeg = ensure_ffmpeg(configured); ffprobe = ensure_ffprobe(ffmpeg);
          path_ffmpeg = ensure_ffmpeg('ffmpeg'); path_ffprobe = shutil.which('ffprobe');
          assert path_ffprobe, 'ffprobe was not found on PATH';
          assert Path(path_ffmpeg).samefile(ffmpeg), f'PATH FFmpeg mismatch: {path_ffmpeg} != {ffmpeg}';
          assert Path(path_ffprobe).samefile(ffprobe), f'PATH FFprobe mismatch: {path_ffprobe} != {ffprobe}';
          print(f'Configured FFmpeg: {configured}'); print(f'Resolved FFmpeg: {ffmpeg}'); print(f'PATH FFmpeg: {path_ffmpeg}');
          print(f'Resolved FFprobe: {ffprobe}'); print(f'PATH FFprobe: {path_ffprobe}');
          subprocess.run(['ffmpeg', '-version'], check=True); subprocess.run(['ffprobe', '-version'], check=True)"

      - name: Install Studio frontend
        working-directory: studio/edmg-studio
        run: pnpm install --frozen-lockfile

      - name: Python lint
        run: >-
          uv run --project studio/edmg-studio/python_backend --frozen
          --extra cpu --group lint ruff check
          studio/edmg-studio/python_backend/edmg_studio_backend/uv_toolchain.py
          studio/edmg-studio/python_backend/pyinstaller_support.py
          studio/edmg-studio/scripts/release_provenance.py
          scripts/run_pytest_scopes.py scripts/check_clap_capability.py
          tests/test_uv_migration_static.py tests/test_setup_wizard_uv.py
          tests/test_uv_source_launcher.py tests/test_clap_capability.py

      - name: Check canonical tooling
        working-directory: studio/edmg-studio
        run: pnpm run check:tooling

      - name: Typecheck
        working-directory: studio/edmg-studio
        run: pnpm run typecheck

      - name: Lint
        working-directory: studio/edmg-studio
        run: pnpm run lint

      - name: Frontend tests
        working-directory: studio/edmg-studio
        run: pnpm run test:ui:release

      - name: Frontend production build
        working-directory: studio/edmg-studio
        run: pnpm run build

      - name: Electron bridge syntax
        working-directory: studio/edmg-studio
        run: pnpm run validate:electron-bridge

      - name: Linux release runtime tests
        if: runner.os == 'Linux'
        working-directory: studio/edmg-studio
        run: |
          pnpm run test:release-toolchain
          pnpm run test:uv-runtime

      - name: Python test scopes
        run: >-
          uv run --project studio/edmg-studio/python_backend --frozen
          --extra cpu --extra core --extra audio --group test
          python scripts/run_pytest_scopes.py

      - name: Validate frozen DirectML profile
        if: runner.os == 'Windows'
        working-directory: studio/edmg-studio/python_backend
        run: uv sync --frozen --extra directml --extra core --extra audio --group test --dry-run

      - name: Validate frozen CUDA profile resolution
        if: runner.os == 'Linux'
        working-directory: studio/edmg-studio/python_backend
        run: uv sync --frozen --extra cuda --extra core --extra audio --group test --dry-run

      - name: Windows Electron integration smoke
        if: runner.os == 'Windows'
        working-directory: studio/edmg-studio
        run: pnpm run validate:desktop-integration:best-effort

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        working-directory: studio/edmg-studio
        run: pnpm run dist:linux

      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        working-directory: studio/edmg-studio
        shell: bash
        run: |
          app_image="$(find dist -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "${app_image}"
          test -x "${app_image}"
          file "${app_image}"
